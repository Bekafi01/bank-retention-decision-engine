[project]
name = "bank-retention-decision-engine"
version = "1.0.0"
description = "End-to-end banking churn prediction, probability calibration, and deposit-at-risk financial optimization engine with FastAPI and Streamlit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.7",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "imbalanced-learn>=0.12.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "optuna>=4.0.0",
    "pandas>=2.2.0",
    "pandera>=0.20.0",
    "plotly>=5.24.0",
    "pydantic>=2.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.2",
    "shap>=0.46.0",
    "streamlit>=1.38.0",
    "uvicorn[standard]>=0.30.0",
    "xgboost>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
